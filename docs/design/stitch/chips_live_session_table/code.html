<!DOCTYPE html><html class="h-full bg-black" lang="en"><head>

<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>

<style data-purpose="custom-scrollbars">
    /* Hide scrollbars for slick native app look */
    .no-scrollbar::-webkit-scrollbar {

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

<style data-purpose="bottom-sheet-animation">
    /* Subtle spring-like entrance animation for bottom sheet */
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .animate-slide-up {
      animation: slideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

</div>
</div>

<!-- END: iOSStatusBar -->
<!-- BEGIN: ScreenHeader -->
<section class="px-5 pt-3 pb-2 flex items-center justify-between shrink-0" data-purpose="session-header">
<div class="flex items-center space-x-3">

</svg>
</button>
<div>

</div>
</div>
<!-- Pot Badge -->

<!-- BEGIN: InstructionalBanner -->

<!-- BEGIN: RebuyModalOverlay -->
<!-- Represents the 5th frame overlay from https://lh3.googleusercontent.com/aida-public/AB6AXuCNe0Ab9K32L-jtHVz-Zkso3cHFAEd1bP4xXHWrEoDHK3X7GKHeNhA5b2y2bOuj01f5jTwjc25fDpKZ6iG4B99zt3KvGqtvk_PtxRx8xkyGzgTAyPA_LOO-u2yj9DBdAPM3Z7pyCTFbDLLS_YsnVo-uOKOMoHfy6wLJBv9w8FiTnTNCzO7MamerYfEpDktUDSzkaume0Chu5MjT705eyJXkVbUjU_5K8-P_FsedqFA7TOK05y7DMYZ-Bdbkketa9lwfHnk -->

<!-- Interactive Bottom Sheet Card -->
<div class="bg-brand-modal w-full rounded-t-[32px] p-6 pb-8 border-t border-neutral-800 shadow-2xl animate-slide-up flex flex-col items-center">
<!-- Grabber handle -->
<div class="w-10 h-1 bg-neutral-600 rounded-full mb-4"></div>

          </button>
<button class="py-2.5 rounded-xl bg-brand-green/20 border border-brand-green/60 text-xs font-bold text-brand-green active:scale-95 transition-all text-center" type="button">

<span class="text-xl leading-none">→</span>
</button>
<!-- Home Indicator Bar -->
<div class="w-32 h-1 bg-neutral-600 rounded-full mx-auto mt-4"></div>
</footer>
<!-- END: StickyFooterBar -->
</div>
<script data-purpose="drawer-interactivity">
    // Lightweight toggle script to demonstrate sheet dismissal & opening
    const modal = document.getElementById('rebuy-modal');
    const confirmBtn = document.getElementById('add-buyin-btn');

    if (confirmBtn && modal) {
      confirmBtn.addEventListener('click', () => {
        modal.classList.add('hidden');
      });
    }

    // Reopen modal if any orange plus button is clicked
    document.querySelectorAll('[aria-label^="Rebuy for"]').forEach((btn) => {
      btn.addEventListener('click', () => {
        modal.classList.remove('hidden');
      });
    });
  </script>
